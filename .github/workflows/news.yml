# E&P Team-Analyzer – offizielle News alle 6 Stunden einsammeln (news/news.json)
# Autor: FGSeRaser – https://github.com/FGSeRaser
name: News

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: News holen
        run: python3 tools/build_news.py
      - name: Speichern
        run: |
          git config user.name "FGSeRaser News-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/news.json
          if git diff --cached --quiet; then echo "Nichts Neues"; exit 0; fi
          git commit -m "News aktualisiert"
          git pull --rebase origin main
          git push origin HEAD:main
