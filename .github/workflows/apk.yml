# Baut bei jedem Push automatisch die Android-APK.
# Die fertige APK findest du unter: Actions -> letzter Lauf -> Artifacts
# Autor: FGSeRaser – https://github.com/FGSeRaser
name: APK bauen

on:
  push:
    paths-ignore:
      - 'news/**'
      - 'assets/data/**'
      - '.github/workflows/daten.yml'
      - '.github/workflows/news.yml'
      - 'tools/build_news.py'
  workflow_dispatch:

# Nötig, damit der Workflow ein Release mit der APK anlegen darf
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Projekt erzeugen (falls noch nicht vorhanden)
        run: |
          if [ ! -d android ]; then
            flutter create --project-name ep_team_analyzer --org de.fgseraser --platforms android .
            rm -f test/widget_test.dart
          fi
          python3 tools/android_anpassen.py

      - run: flutter pub get

      - name: Code prüfen
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Versionsnummern festlegen
        id: version
        run: |
          # Build-Nummer steigt mit jedem Lauf -> die App erkennt daran neue Versionen
          echo "build=$((100 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        run: |
          flutter build apk --release --build-number=${{ steps.version.outputs.build }} --build-name=${{ steps.version.outputs.name }}
          cp build/app/outputs/flutter-apk/app-release.apk EP-Team-Analyzer.apk

      - name: Signatur prüfen (muss unser fester Schlüssel sein, sonst gehen Updates nicht)
        run: |
          soll=$(keytool -exportcert -keystore android-signatur/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          ist=$("$apksigner" verify --print-certs EP-Team-Analyzer.apk | grep -m1 'SHA-256' | sed 's/.*: //')
          echo "Soll: $soll"
          echo "Ist:  $ist"
          if [ "$soll" != "$ist" ]; then echo "::error::APK ist nicht mit android-signatur/debug.keystore signiert!"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: EP-Team-Analyzer-APK
          path: EP-Team-Analyzer.apk

      - name: Release-Text (nur die erste Zeile der Änderung)
        id: text
        run: |
          zeile="$(git log -1 --pretty=%s)"
          echo "text=${zeile:-Neue Heldendaten}" >> "$GITHUB_OUTPUT"

      - name: Release mit APK anlegen (für das Update in der App)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.build }}
          name: v${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.build }})
          body: ${{ steps.text.outputs.text }}
          files: EP-Team-Analyzer.apk
          make_latest: true
