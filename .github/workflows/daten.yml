# Holt alle 6 Stunden die neuesten Heldendaten von HeroPlan, baut Datenbank,
# Porträt-Fingerabdrücke und Talente neu und committet sie mit assets/data/stand.json.
# Die App lädt neue Daten selbst von GitHub – dafür ist KEIN neues APK nötig.
# Autor: FGSeRaser – https://github.com/FGSeRaser
name: Heldendaten aktualisieren

on:
  schedule:
    - cron: '41 */6 * * *'   # alle 6 Stunden
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  daten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow

      - name: HeroPlan holen (nur Daten, Sprachen und Porträts)
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/heroplan/heroplan.github.io.git heroplan
          cd heroplan
          git sparse-checkout set --no-cone data/ 'langs_json/*_de.json' 'langs_json/*_en.json' imgs/hero_icon/ talent-tree.js
          git checkout

      - name: Datenbank und Fingerabdrücke bauen
        run: |
          python3 tools/build_helden_db.py heroplan
          python3 tools/build_portraits.py heroplan
          python3 tools/build_talente.py heroplan
          # Version nur erhöhen, wenn sich wirklich etwas geändert hat
          if python3 tools/build_stand.py; then echo "neu=1" >> "$GITHUB_ENV"; else git checkout -- assets/data; fi

      - name: Änderungen committen
        run: |
          git config user.name "FGSeRaser Daten-Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Heldendaten aktualisiert ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
