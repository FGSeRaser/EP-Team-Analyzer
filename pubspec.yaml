name: ep_team_analyzer
description: "E&P Team-Analyzer – Helden-Wissen, Konter und Team-Analyse für Empires & Puzzles. Von FGSeRaser (github.com/FGSeRaser)."
publish_to: 'none'
version: 0.7.1+8

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: '>=0.13.0 <1.0.0'
  package_info_plus: '>=8.0.0 <10.0.0'
  path_provider: ^2.1.4
  open_filex: '>=4.5.0 <6.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/helden.json
    - assets/data/portraits.json
    - assets/data/portraits.bin
    - assets/icon/icon.png
